spring.application.name=biblov1

# MySQL config (override via env: DB_URL, DB_USERNAME, DB_PASSWORD)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/biblov1?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:change-me}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration (override via env: APP_JWT_SECRET)
app.jwtSecret=${APP_JWT_SECRET:change-me}
app.jwtExpirationMs=86400000

# CORS Configuration (comma-separated list; update with your deployed frontend origin)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Server Configuration
server.port=8080

# Upload directory for profile pictures (override via env: UPLOAD_DIR)
app.upload.dir=${UPLOAD_DIR:uploads}

# Maximum file size for uploads (50MB)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Logging Configuration
logging.level.com.example.biblov1=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

# File upload directory (consistent with app.upload.dir)
file.upload-dir=${UPLOAD_DIR:uploads}

# Bot behavior defaults
app.bots.autoMatchOnRegister=${APP_BOTS_AUTO_MATCH_ON_REGISTER:false}
app.bots.social.enabled=${APP_BOTS_SOCIAL_ENABLED:true}
app.bots.social.welcome.enabled=${APP_BOTS_SOCIAL_WELCOME_ENABLED:true}
app.bots.social.welcome.delay-min-seconds=${APP_BOTS_SOCIAL_WELCOME_DELAY_MIN_SECONDS:3}
app.bots.social.welcome.delay-max-seconds=${APP_BOTS_SOCIAL_WELCOME_DELAY_MAX_SECONDS:15}
app.bots.social.reactions.enabled=${APP_BOTS_SOCIAL_REACTIONS_ENABLED:true}
app.bots.social.reactions.likes-min=${APP_BOTS_SOCIAL_REACTIONS_LIKES_MIN:1}
app.bots.social.reactions.likes-max=${APP_BOTS_SOCIAL_REACTIONS_LIKES_MAX:2}
app.bots.social.reactions.comments-max=${APP_BOTS_SOCIAL_REACTIONS_COMMENTS_MAX:1}
app.bots.social.reactions.delay-min-seconds=${APP_BOTS_SOCIAL_REACTIONS_DELAY_MIN_SECONDS:2}
app.bots.social.reactions.delay-max-seconds=${APP_BOTS_SOCIAL_REACTIONS_DELAY_MAX_SECONDS:8}
app.bots.social.cross-post.enabled=${APP_BOTS_SOCIAL_CROSS_POST_ENABLED:true}
app.bots.social.cross-post.interval-seconds=${APP_BOTS_SOCIAL_CROSS_POST_INTERVAL_SECONDS:3600}
app.bots.social.cross-post.max-comments-per-bot=${APP_BOTS_SOCIAL_CROSS_POST_MAX_COMMENTS_PER_BOT:1}
